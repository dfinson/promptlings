name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  installer:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell installer
        shell: pwsh
        run: ./tests/test_install.ps1
      - name: Bash installer
        shell: bash
        run: bash tests/test_install.sh

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"

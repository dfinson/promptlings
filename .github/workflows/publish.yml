name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20"
      - run: npm ci --no-fund --no-audit
      - run: npm test

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11.5.1
      - name: Check tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci --no-fund --no-audit
      # Authenticates through the npm trusted publisher for this workflow (OIDC). No token is stored.
      # Only prereleases exist so far, so each release is published as latest and plain `npx promptlings` resolves it.
      # Trusted publishing cannot run `npm dist-tag`, so the tag is set here.
      - name: Publish
        run: npm publish --access public --provenance --tag latest
      - name: Verify npm latest and download the published package
        run: |
          version=$(node -p 'require("./package.json").version')
          directory="$RUNNER_TEMP/promptlings-release"
          mkdir -p "$directory"
          for attempt in {1..6}; do
            npm view promptlings dist-tags --json --prefer-online > "$directory/dist-tags.json"
            latest=$(node -p 'require(process.env.RUNNER_TEMP + "/promptlings-release/dist-tags.json").latest')
            echo "Registry latest: $latest, expected: $version (attempt $attempt)"
            if [ "$latest" = "$version" ]; then break; fi
            sleep 10
          done
          test "$latest" = "$version"
          npm pack "promptlings@$version" --ignore-scripts --pack-destination "$directory" --json > "$directory/pack.json"
      - name: Retain the published npm package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promptlings-${{ github.ref_name }}
          path: ${{ runner.temp }}/promptlings-release/
          if-no-files-found: error
          retention-days: 14